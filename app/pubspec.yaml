name: homemade
description: "Home-made: finanze di casa."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  crypto: ^3.0.8
  cupertino_icons: ^2.0.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  google_sign_in: ^7.2.0
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  local_auth_android: ^2.3.0
  material_symbols_icons: ^4.2960.0
  material_ui: ^1.11.1
  riverpod_annotation: ^4.0.8
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  http: ^1.6.0
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.10
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    # Google Sans Flex 5.000, the variable file of the google/fonts
    # repository (ofl/googlesansflex), under the licence in OFL.txt.
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
