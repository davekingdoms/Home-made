name: Flutter setup
description: >-
  Flutter at the version pinned in .fvmrc, the app dependencies and the
  generated code (*.g.dart, *.freezed.dart), which is not committed.
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version-file: .fvmrc
        cache: true
    - name: Get dependencies
      shell: bash
      working-directory: app
      run: flutter pub get
    - name: Generate code
      shell: bash
      working-directory: app
      run: dart run build_runner build --delete-conflicting-outputs
