# Weekly updates, minor and patch versions grouped in one pull request per
# ecosystem; major versions come one by one.
version: 2
updates:
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
    groups:
      pub:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/flutter-setup
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
