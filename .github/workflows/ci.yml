# Checks of every pull request towards main; their job names are the
# required status checks of the main ruleset: gitleaks, app, golden,
# tokens, database, functions.
#
# The repository is public: no secrets in these jobs, no pull_request_target,
# no artifacts, and the logs show outcomes only.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets the "Update goldens" workflow run the checks again on the commit it
  # pushes: pushes made with GITHUB_TOKEN start no workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No report as artifact, no comments, no summary: outcome only.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_SUMMARY: false

  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-setup
      - name: Check formatting
        working-directory: app
        # Committed files only: the generated ones are not in git.
        run: git ls-files -z -- '*.dart' | xargs -0 dart format --output=none --set-exit-if-changed
      - name: Analyze
        working-directory: app
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        working-directory: app
        run: flutter test --exclude-tags golden

  golden:
    name: golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flutter-setup
      - name: Golden tests
        working-directory: app
        # The reference images come from this runner (Linux); to update
        # them use the "Update goldens" workflow.
        run: flutter test --tags golden

  tokens:
    name: tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Contrast of the colour tokens
        run: python3 tools/contrasti/contrasti.py docs/spec/stile.md

  database:
    name: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Look for migrations and tests
        id: find
        run: |
          migrations=$(find supabase/migrations -name '*.sql' 2>/dev/null | wc -l)
          tests=$(find supabase/tests -name '*.sql' 2>/dev/null | wc -l)
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "Migrations: $migrations, tests: $tests"
      - uses: supabase/setup-cli@v3
        if: steps.find.outputs.migrations != '0' || steps.find.outputs.tests != '0'
        with:
          version: latest
      - name: Start the local database with the migrations
        if: steps.find.outputs.migrations != '0' || steps.find.outputs.tests != '0'
        # Only errors in the log: the output lists the local keys.
        run: supabase start > /dev/null
      - name: pgTAP tests
        if: steps.find.outputs.tests != '0'
        run: supabase test db

  functions:
    name: functions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7
      # The Deno version of the Supabase Edge Runtime, kept in .dvmrc.
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
      - name: Check formatting
        run: deno task fmt:check
      - name: Lint
        run: deno task lint
      - name: Test
        # No secrets and no network: fetch is faked, keys are generated.
        run: deno task test
